#端口
server:
  port: 9527


spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 #nacos服务注册中心地址
        namespace: a5bdafd9-cde2-44ec-a436-36f156bc5b5b
      config:
        server-addr: localhost:8848 #nacos作为配置中心地址
        file-extension: yaml #指定yaml格式的配置
        group: DEFAULT_GROUP #指定分组
        namespace: a5bdafd9-cde2-44ec-a436-36f156bc5b5b #指定spacename



    gateway:
      #开启从注册中心动态创建路由的功能，利用微服务名进行路由
      discovery:
        locator:
          enabled: true
      # 写死的地址
      #      routes:
      #        - id: payment_routh #payment_routh #路由的id，没有固定规则但要求唯一，建议配合服务名
      #          uri: http://localhost:8001  #匹配后提供服务的路由地址
      #          predicates:
      #            - Path=/payment/get/** #断言，路径相匹配的进行路由
      #
      #        - id: payment_routh2 #payment_routh #路由的id，没有固定规则但要求唯一，建议配合服务名
      #          uri: http://localhost:8001  #匹配后提供服务的路由地址
      #          predicates:
      #            - Path=/payment/lb/** #断言，路径相匹配的进行路由
      #动态的地址，负载均衡，通过为服务名
      routes:
        - id: nacos-payment-consumer_routh #payment_routh #路由的id，没有固定规则但要求唯一，建议配合服务名
          #uri: http://localhost:8001  #匹配后提供服务的路由地址
          uri: lb://nacos-payment-consumer  #匹配后提供服务的路由地址
          predicates:
            - Path=/** # 拦截所有请求